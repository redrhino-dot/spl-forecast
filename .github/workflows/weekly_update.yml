name: Weekly SPFL Stats Update

# Runs every Monday at 07:00 UTC, after the weekend's Scottish Premiership
# fixtures are complete. Pulls new results from TheSportsDB, rebuilds
# team_stats.csv, and commits the change, printing the latest power-ranking
# scorecard to the run log.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch: {} # allows manual "Run workflow" trigger from the Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest results from TheSportsDB
        run: node scripts/fetch_results.js results.csv

      - name: Rebuild team_stats.csv
        run: node scripts/build_team_stats.js results.csv team_stats.csv

      - name: Show updated power rankings
        run: node spfl_predictor.js team_stats.csv --scorecard

      - name: Commit updated stats
        run: |
          git config user.name "spfl-predictor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results.csv team_stats.csv
          git diff --staged --quiet || git commit -m "Weekly stats update: $(date -u +'%Y-%m-%d')"
          git push
