name: Weekly SPFL Stats Update

# Runs every Monday at 07:00 UTC, after the weekend's Scottish Premiership
# fixtures are complete. Rebuilds team_stats.csv from results.csv and commits
# the change, then prints the latest power-ranking scorecard to the run log.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch: {} # allows manual "Run workflow" trigger from the Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # --- Optional: fetch this week's results automatically ---
      # Replace this step with a call to whichever source you're already
      # using for live scores (ESPN, TheSportsDB, football-data.org). It
      # should append newly completed fixtures to results.csv in the format:
      #   Date,HomeTeam,AwayTeam,HomeGoals,AwayGoals
      # Until that's wired up, append new results to results.csv manually
      # before this workflow runs, or right in this step via a small script.
      - name: Fetch latest results (placeholder — wire up your existing API)
        run: |
          echo "TODO: call your results-fetching script here, e.g.:"
          echo "  node scripts/fetch_results.js results.csv"
          echo "Skipping for now — using results.csv as committed."

      - name: Rebuild team_stats.csv
        run: node scripts/build_team_stats.js results.csv team_stats.csv

      - name: Show updated power rankings
        run: node spfl_predictor.js team_stats.csv --scorecard

      - name: Commit updated stats
        run: |
          git config user.name "spfl-predictor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add team_stats.csv
          git diff --staged --quiet || git commit -m "Weekly stats update: $(date -u +'%Y-%m-%d')"
          git push
