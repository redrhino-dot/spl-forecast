name: Daily SPFL Stats Update

# Runs once a day at 06:00 UTC. Pulls every round individually via
# eventsround.php (eventsseason.php on the free/registered key only
# returns a preview), rebuilds results.csv/team_stats.csv/fixtures.csv,
# refreshes odds, and commits whatever actually changed. Running daily
# (not just Monday) means a gameweek's results land the same day
# TheSportsDB posts them, instead of waiting up to a week.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {} # allows manual "Run workflow" trigger from the Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pull all rounds from TheSportsDB
        env:
          THESPORTSDB_KEY: ${{ secrets.THESPORTSDB_KEY }}
        run: node scripts/fetch_all_rounds.js data/all_events.json

      - name: Derive results.csv and fixtures.csv
        run: node scripts/derive_results_fixtures.js data/all_events.json results.csv fixtures.csv

      - name: Rebuild team_stats.csv
        run: node scripts/build_team_stats.js results.csv team_stats.csv

      - name: Fetch bookmaker odds (requires ODDS_API_KEY secret)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/fetch_odds.js odds.json

      - name: Show updated power rankings
        run: node spfl_predictor.js team_stats.csv --scorecard

      - name: Commit updated data
        run: |
          git config user.name "spfl-predictor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/all_events.json results.csv team_stats.csv fixtures.csv odds.json
          git diff --staged --quiet || git commit -m "Daily stats/fixtures/odds update: $(date -u +'%Y-%m-%d %H:%M')"
          git push
